<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Blog - My Blog</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <nav>

            <a href="/">Home</a>

            <a href="/blog">Blog</a>

        </nav>

    </header>


    <section class="container">

        <h1>Add a New Blog</h1>

        <p>Create and publish a new blog post.</p>


        <form id="blogForm">

            <input
                type="text"
                id="title"
                placeholder="Enter Blog Title"
                required
            >

            <textarea
                id="content"
                rows="6"
                placeholder="Enter Blog Content"
                required
            ></textarea>

            <button type="submit">
                Add Blog
            </button>

        </form>


        <p id="message"></p>

    </section>


    <footer>

        <p>© 2026 My Blog. All Rights Reserved.</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
