<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create a new blog post"
    >

    <title>My Blog - Add Blog</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <nav class="navbar">

        <a href="/" class="logo">
            My Blog
        </a>

        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a
                href="/blog"
                class="active"
            >
                Add Blog
            </a>

        </div>

    </nav>

</header>


<main>

    <section class="form-section">

        <div class="section-heading">

            <h1>
                Create a New Blog
            </h1>

            <p>
                Share your thoughts with the world.
            </p>

        </div>


        <form id="blogForm">

            <label for="title">
                Blog Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Enter blog title"
                required
                maxlength="100"
            >


            <label for="content">
                Blog Content
            </label>

            <textarea
                id="content"
                rows="9"
                placeholder="Write your blog content..."
                required
                maxlength="2000"
            ></textarea>


            <button
                type="submit"
                class="primary-button"
            >
                Publish Blog
            </button>

        </form>


        <p id="message"></p>

    </section>

</main>


<footer>

    <p>
        © 2026 My Blog
    </p>

    <p class="footer-note">
        Full Stack Development Project
    </p>

    <a href="/">
        ← Back to Home
    </a>

</footer>


<script src="script.js" defer></script>

</body>

</html>
