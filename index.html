<!DOCTYPE html>
<html>
<head>
    <title>Day 6 Blog</title>

</head>

<body>

<p>Create Blog Posts</p>

<button id="btn">Click Me</button>

<h2>Add Blog</h2>

placeholder="Blog Content">

<br><br>

<button type="submit">
Submit Blog
</button>

</form>

<p id="message"></p>

<h2>All Blogs</h2>

<div id="blogList"></div>

<script src="script.js"></script>

</body>
</html>
