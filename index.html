<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Home - My Blog</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <nav>

            <a href="/">Home</a>

            <a href="/blog">Blog</a>

        </nav>

    </header>


    <section class="hero">

        <h1>Welcome to My Blog Website</h1>

        <p>Blogs are loaded from the Express API.</p>

    </section>


    <section class="blogs-section">

        <h2>All Blog Posts</h2>

        <p id="loadingMessage">
            Loading blogs...
        </p>

        <div id="blogList">

        </div>

    </section>


    <!-- Edit Blog -->

    <section
        id="editSection"
        class="edit-section"
    >

        <h2>Edit Blog</h2>

        <form id="editForm">

            <input
                type="hidden"
                id="editId"
            >

            <input
                type="text"
                id="editTitle"
                placeholder="Blog Title"
                required
            >

            <textarea
                id="editContent"
                rows="6"
                placeholder="Blog Content"
                required
            ></textarea>

            <button type="submit">
                Update Blog
            </button>

            <button
                type="button"
                id="cancelEdit"
                class="cancel-button"
            >
                Cancel
            </button>

        </form>

        <p id="editMessage"></p>

    </section>


    <footer>

        <p>© 2026 My Blog. All Rights Reserved.</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
