<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Responsive blog website"
    >

    <title>My Blog - Home</title>

    <link rel="stylesheet" href="style.css">

</head>

<body id="top">

<header>

    <nav class="navbar">

        <a href="index.html" class="logo">
            My Blog
        </a>

        <div class="nav-links">

            <a
                href="index.html"
                class="active"
            >
                Home
            </a>

            <a href="blog.html">
                Add Blog
            </a>

            <a href="#blogs">
                Blogs
            </a>

        </div>

    </nav>

</header>


<main>

    <section class="hero">

        <div class="hero-content">

            <h1>
                Welcome to My Blog
            </h1>

            <p>
                Create, read, edit and manage your blog posts.
            </p>

            <div class="hero-buttons">

                <a
                    href="blog.html"
                    class="primary-button"
                >
                    Add New Blog
                </a>

                <a
                    href="#blogs"
                    class="secondary-button"
                >
                    View Blogs
                </a>

            </div>

        </div>

    </section>


    <section
        id="blogs"
        class="blogs-section"
    >

        <div class="section-heading">

            <h2>
                All Blog Posts
            </h2>

            <p>
                Explore the latest posts.
            </p>

        </div>


        <p
            id="loadingMessage"
            class="loading"
        >
            Loading blogs...
        </p>


        <div id="blogList"></div>

    </section>


    <section
        id="editSection"
        class="edit-section"
    >

        <div class="section-heading">

            <h2>
                Edit Blog
            </h2>

        </div>


        <form id="editForm">

            <input
                type="hidden"
                id="editId"
            >


            <label for="editTitle">
                Blog Title
            </label>

            <input
                type="text"
                id="editTitle"
                placeholder="Enter blog title"
                required
                maxlength="100"
            >


            <label for="editContent">
                Blog Content
            </label>

            <textarea
                id="editContent"
                rows="7"
                placeholder="Enter blog content"
                required
                maxlength="2000"
            ></textarea>


            <div class="form-buttons">

                <button
                    type="submit"
                    class="primary-button"
                >
                    Update Blog
                </button>

                <button
                    type="button"
                    id="cancelEdit"
                    class="cancel-button"
                >
                    Cancel
                </button>

            </div>

        </form>


        <p id="editMessage"></p>

    </section>

</main>


<footer>

    <p>
        © 2026 My Blog
    </p>

    <p class="footer-note">
        GitHub Pages Project
    </p>

    <a href="#top">
        Back to Top ↑
    </a>

</footer>


<script src="script.js" defer></script>

</body>

</html>
